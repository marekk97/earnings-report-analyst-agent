      - {value: 13607000000, unit: usd, aliases: [Europe, EMEA], source: "NKE FY2024 10-K XBRL (SubsegmentsAxis)"}
      - {value: 7545000000, unit: usd, aliases: [Greater China], source: "NKE FY2024 10-K XBRL (SubsegmentsAxis)"}
      - {value: 6729000000, unit: usd, aliases: [Asia Pacific, APLA], source: "NKE FY2024 10-K XBRL (SubsegmentsAxis)"}
