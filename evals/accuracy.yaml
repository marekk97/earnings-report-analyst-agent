      - {golden: wmt_fy2024_revenue_growth_yoy, period_hint: true}
  - id: acc_nvda_nm_years
    category: time_series
    question: "Show NVIDIA's net margin for fiscal years 2022, 2023 and 2024."
    facts:
      - {golden: nvda_fy2022_net_margin, period_hint: true}
