# Metric-accuracy dataset (end-to-end): the agent answers the question; the scorer checks ONLY whether the
# numbers it states in the brief are correct. Run:  earnings-analyst eval --suite accuracy
#
# Each case lists the facts its answer must contain. A fact is one number, defined by:
#   golden: <id>            expected value from metric_goldens.yaml / cases.yaml (read independently from the filing)
#   change_of: [<a>, <b>]   expected value = golden a - golden b (percentage-point change for percent metrics)
#   value + unit            a literal expected value (segment figures; source noted in `source`)
# and how to find it in the brief:
#   aliases                 words that identify the fact (metric name, region, company); defaults per metric
#   period_hint: true       the row/sentence must also name the fact's period (needed when several periods appear)
#
# A fact is "stated correctly" if a row (table) or sentence (prose) that mentions an alias - and the period, when
# required - contains a number equal to the expected value at the precision the brief displays it. Signs are
# ignored ("fell 2.8%" matches -2.80). Units: percent, pp, usd, ratio, days, times.

accuracy_cases:
  # ------------------------------------------------------------------ one metric, different companies
  - id: acc_ko_opm
    category: single_metric
    question: "What was Coca-Cola's operating margin in fiscal 2024?"
    facts: [{golden: ko_fy2024_operating_margin}]
  - id: acc_cost_gm
    category: single_metric
    question: "What was Costco's gross margin in fiscal 2024?"
    facts: [{golden: cost_fy2024_gross_margin}]
  - id: acc_wmt_growth
    category: single_metric
    question: "How much did Walmart's revenue grow in fiscal 2024?"
    facts: [{golden: wmt_fy2024_revenue_growth_yoy}]
  - id: acc_msft_fcf
    category: single_metric
    question: "How much free cash flow did Microsoft generate in fiscal 2024?"
    facts: [{golden: msft_fy2024_free_cash_flow}]
  - id: acc_hd_current
    category: single_metric
    question: "What was Home Depot's current ratio at the end of fiscal 2023?"
    facts: [{golden: hd_fy2023_current_ratio}]
  - id: acc_cat_roe
    category: single_metric
    question: "What was Caterpillar's return on equity in 2024?"
    facts: [{golden: cat_fy2024_roe}]
  - id: acc_aapl_dso
    category: single_metric
    question: "What were Apple's days sales outstanding in fiscal 2024?"
    facts: [{golden: aapl_fy2024_dso}]
  - id: acc_pg_nm
    category: single_metric
    question: "What was Procter & Gamble's net margin in fiscal 2024?"
    facts: [{golden: pg_fy2024_net_margin}]
  - id: acc_mcd_growth
    category: single_metric
    question: "By how much did McDonald's revenue grow in 2023?"
    facts: [{golden: mcd_fy2023_revenue_growth_yoy}]
  - id: acc_adbe_fcfm
    category: single_metric
    question: "What was Adobe's free cash flow margin in fiscal 2023?"
    facts: [{golden: adbe_fy2023_fcf_margin}]

  # ------------------------------------------------------------------ several metrics at once
  - id: acc_aapl_profitability
    category: multi_metric
    question: "Give me Apple's revenue growth, gross margin, operating margin and net margin for fiscal 2023."
    facts:
      - {golden: aapl_fy2023_revenue_growth_yoy}
      - {golden: aapl_fy2023_gross_margin}
      - {golden: aapl_fy2023_operating_margin}
      - {golden: aapl_fy2023_net_margin}
  - id: acc_googl_mix
    category: multi_metric
    question: "What were Alphabet's revenue growth, operating margin and free cash flow in 2023?"
    facts:
      - {golden: googl_fy2023_revenue_growth_yoy}
      - {golden: googl_fy2023_operating_margin}
      - {golden: googl_fy2023_free_cash_flow}
  - id: acc_wmt_ops
    category: multi_metric
    question: "Summarise Walmart's fiscal 2024 revenue growth, gross margin and inventory turnover."
    facts:
      - {golden: wmt_fy2024_revenue_growth_yoy}
      - {golden: wmt_fy2024_gross_margin}
      - {golden: wmt_fy2024_inventory_turnover}
  - id: acc_unh_margins
    category: multi_metric
    question: "What were UnitedHealth's revenue growth, operating margin and net margin in 2023?"
    facts:
      - {golden: unh_fy2023_revenue_growth_yoy}
      - {golden: unh_fy2023_operating_margin}
      - {golden: unh_fy2023_net_margin}
  - id: acc_orcl_mix
    category: multi_metric
    question: "Report Oracle's fiscal 2024 revenue growth, operating margin and free cash flow margin."
    facts:
      - {golden: orcl_fy2024_revenue_growth_yoy}
      - {golden: orcl_fy2024_operating_margin}
      - {golden: orcl_fy2024_fcf_margin}
  - id: acc_cat_scorecard
    category: multi_metric
    question: "For Caterpillar's 2023 fiscal year, what were revenue growth, operating margin, return on equity and the current ratio?"
    facts:
      - {golden: cat_fy2023_revenue_growth_yoy}
      - {golden: cat_fy2023_operating_margin}
      - {golden: cat_fy2023_roe}
      - {golden: cat_fy2023_current_ratio}

  # ------------------------------------------------------------------ comparing two periods
  - id: acc_aapl_gm_2y
    category: two_period
    question: "How did Apple's gross margin in fiscal 2023 compare with fiscal 2022?"
    facts:
      - {golden: aapl_fy2023_gross_margin, period_hint: true}
      - {golden: aapl_fy2022_gross_margin, period_hint: true}
      - {change_of: [aapl_fy2023_gross_margin, aapl_fy2022_gross_margin]}
  - id: acc_tsla_gm_2y
    category: two_period
    question: "Compare Tesla's gross margin in 2023 with 2022."
    facts:
      - {golden: tsla_fy2023_gross_margin, period_hint: true}
      - {golden: tsla_fy2022_gross_margin, period_hint: true}
      - {change_of: [tsla_fy2023_gross_margin, tsla_fy2022_gross_margin]}
  - id: acc_intc_nm_2y
    category: two_period
    question: "How did Intel's net margin change between 2022 and 2023?"
