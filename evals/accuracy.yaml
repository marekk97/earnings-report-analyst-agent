  # ------------------------------------------------------------------ grouped by region / segment / product
  # Segment values come from each 10-K's XBRL; Apple and Microsoft were confirmed against their published
  # annual reports; Nike's four regions sum (with Global Brand Divisions) to NIKE Brand revenue.
  - id: acc_aapl_regions
    category: by_region
    question: "Break down Apple's fiscal 2023 revenue by geographic segment."
    facts:
      - {value: 162560000000, unit: usd, aliases: [Americas], source: "AAPL FY2023 10-K segment note"}
      - {value: 94294000000, unit: usd, aliases: [Europe], source: "AAPL FY2023 10-K segment note"}
      - {value: 72559000000, unit: usd, aliases: [Greater China, China], source: "AAPL FY2023 10-K segment note"}
      - {value: 24257000000, unit: usd, aliases: [Japan], source: "AAPL FY2023 10-K segment note"}
      - {value: 29615000000, unit: usd, aliases: [Rest of Asia Pacific, Rest of Asia], source: "AAPL FY2023 10-K segment note"}
  - id: acc_nke_regions
