      - {value: 28300000000, unit: usd, aliases: [iPad], source: "AAPL FY2023 10-K"}
      - {value: 39845000000, unit: usd, aliases: [Wearables], source: "AAPL FY2023 10-K"}
      - {value: 85200000000, unit: usd, aliases: [Services, Service], source: "AAPL FY2023 10-K"}

  # ------------------------------------------------------------------ comparing companies
  - id: acc_ko_vs_pep
    category: cross_company
    question: "Compare the 2023 operating margins of Coca-Cola and PepsiCo."
    facts:
      - {golden: ko_fy2023_operating_margin, aliases: [Coca-Cola, Coca Cola, KO]}
      - {golden: pep_fy2023_operating_margin, aliases: [PepsiCo, Pepsi, PEP]}
  - id: acc_retail_gm
    category: cross_company
    question: "Compare the fiscal 2023 gross margins of Walmart, Costco and Home Depot."
    facts:
      - {golden: wmt_fy2023_gross_margin, aliases: [Walmart, WMT]}
      - {golden: cost_fy2023_gross_margin, aliases: [Costco, COST]}
      - {golden: hd_fy2023_gross_margin, aliases: [Home Depot, HD]}
  - id: acc_aapl_vs_msft
