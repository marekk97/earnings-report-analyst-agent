      - {value: 105362000000, unit: usd, aliases: [Intelligent Cloud], source: "MSFT FY2024 10-K segment note"}
      - {value: 62032000000, unit: usd, aliases: [More Personal Computing, Personal Computing], source: "MSFT FY2024 10-K segment note"}
      - {value: 40540000000, unit: usd, aliases: [Productivity], source: "MSFT FY2024 10-K segment operating income"}
      - {value: 49584000000, unit: usd, aliases: [Intelligent Cloud], source: "MSFT FY2024 10-K segment operating income"}
      - {value: 19309000000, unit: usd, aliases: [More Personal Computing, Personal Computing], source: "MSFT FY2024 10-K segment operating income"}
