  # ------------------------------------------------------------------ over a period of time
  - id: acc_aapl_gm_quarters
    category: time_series
    question: "What was Apple's gross margin in each quarter of fiscal 2024?"
    facts:
      - {golden: aapl_q1fy2024_gross_margin, period_hint: true}
      - {golden: aapl_q2fy2024_gross_margin, period_hint: true}
      - {golden: aapl_q3fy2024_gross_margin, period_hint: true}
      - {golden: aapl_q4fy2024_gross_margin, period_hint: true}
  - id: acc_msft_growth_quarters
    category: time_series
    question: "Show Microsoft's year-over-year revenue growth for each quarter of fiscal 2024."
    facts:
      - {golden: msft_q1fy2024_revenue_growth_yoy, period_hint: true}
      - {golden: msft_q2fy2024_revenue_growth_yoy, period_hint: true}
      - {golden: msft_q3fy2024_revenue_growth_yoy, period_hint: true}
      - {golden: msft_q4fy2024_revenue_growth_yoy, period_hint: true}
  - id: acc_hd_gm_quarters
    category: time_series
    question: "How did Home Depot's gross margin move across the four quarters of fiscal 2024?"
    facts:
