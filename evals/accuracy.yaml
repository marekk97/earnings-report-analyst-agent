      - {golden: meta_fy2022_operating_margin, period_hint: true}
      - {change_of: [meta_fy2023_operating_margin, meta_fy2022_operating_margin]}
  - id: acc_ko_cr_2y
    category: two_period
    question: "Was Coca-Cola's current ratio higher at the end of 2024 or 2023?"
    facts:
      - {golden: ko_fy2024_current_ratio, period_hint: true}
      - {golden: ko_fy2023_current_ratio, period_hint: true}
  - id: acc_nvda_growth_2y
    category: two_period
    question: "Compare NVIDIA's revenue growth in fiscal 2024 with fiscal 2023."
    facts:
      - {golden: nvda_fy2024_revenue_growth_yoy, period_hint: true}
      - {golden: nvda_fy2023_revenue_growth_yoy, period_hint: true}

  # ------------------------------------------------------------------ a specific quarter
  - id: acc_msft_q2
    category: quarter
    question: "What were Microsoft's revenue growth and gross margin in the second quarter of fiscal 2024?"
    facts:
      - {golden: msft_q2fy2024_revenue_growth_yoy}
      - {golden: msft_q2fy2024_gross_margin}
  - id: acc_nke_q3
    category: quarter
    question: "What were Nike's gross margin and net margin in the third quarter of fiscal 2024?"
    facts:
